<!doctype html>
<!--
  관리자 지도(네이버 지도). ui/naver_map.py 가 iframe 으로 띄운다.
  Streamlit 정적 파일(/app/static/)로 localhost:8501 주소에서 열려야 네이버 인증(Web 서비스 URL)이 통과한다.
    ?key=<NAVER_MAP_KEY_ID>   네이버 클라우드 플랫폼 Maps Client ID
    #<base64(JSON)>           {fit, items}: items = 결함 목록. 바뀌면 지도를 다시 만들지 않고 점만 다시 찍는다(확대·위치 유지)
                              fit = 대시보드 필터를 나타내는 글자. 바뀌면 걸러진 결함이 다 보이게 옮긴다("" 이면 전국)
                              읽은 뒤 주소에서 지운다(긴 주소는 네이버 인증 실패)
  처음 화면은 대한민국 전체. 새로 생긴 결함(d.fresh)은 하늘색 고리와 '신규' 알약 표시(움직이지 않는다).
  핀 색 = 유형(d.type_color, 블랙박스 화면 상자 색과 같다), 모양 = 상태. risk_level 은 쓰지 않는다.
  핀을 누르면 사진 말풍선(꼬리 끝이 핀 위), 빈 곳을 누르면 닫힌다. 다른 핀을 누르면 그 핀의 말풍선만 남는다.
  확대가 CLUSTER_UNTIL 보다 작으면 화면에서 가까운 점들을 숫자 묶음으로 보이고, 누르면 그 묶음으로 확대한다.
-->
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 화면 모양(ui/style.py)과 같다: 짙은 남색 #051766·하늘색 #57bbeb, 둥근 흰 상자, 알약 표시, 그림자는 아주 옅게 */
  html, body { margin: 0; height: 100%; color: #111;
               font-family: 'Pretendard Variable', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
  #map { width: 100%; height: 100%; }  /* 네이버 지도가 position 을 relative 로 바꾸므로 inset 이 아니라 크기로 준다 */
  #err { display: none; position: absolute; inset: 0; z-index: 10; padding: 16px; background: #fff;
         color: #c42b1c; font-size: 14px; }
  /* 결함 표시: 가운데 핀(색=유형, 모양=상태). 새 결함은 하늘색 고리 + '신규' 알약 (움직이지 않는다) */
  .sig { position: relative; width: 18px; height: 18px; }
  .sig .core { position: absolute; left: 1px; top: 1px; }
  .sig.fresh::before { content: ""; position: absolute; left: -6px; top: -6px; width: 30px; height: 30px; border-radius: 50%;
                       border: 3px solid #57bbeb; box-sizing: border-box; background: rgba(230,243,251,.7); }
  .pin { width: 16px; height: 16px; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(5,23,102,.35); box-sizing: border-box;
         border-radius: 3px; }
  .pin.c { border-radius: 50%; }
  .tri { width: 0; height: 0; margin-left: -1px; border-left: 9px solid transparent; border-right: 9px solid transparent;
         border-bottom-width: 16px; border-bottom-style: solid; filter: drop-shadow(0 0 1px rgba(5,23,102,.6)); }
  .new-tag { position: absolute; left: 24px; top: -14px; background: #051766; color: #fff; font-size: 11px;
             font-weight: 700; padding: 0 8px; line-height: 19px; border-radius: 999px; white-space: nowrap; }
  /* 묶음: 남색 원 + 숫자 */
  .cl { position: relative; width: 34px; height: 34px; cursor: pointer; }
  .cl .num { position: absolute; inset: 0; border-radius: 50%; background: #051766; color: #fff; font-weight: 700;
             font-size: 14px; display: flex; align-items: center; justify-content: center;
             border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(5,23,102,.25); box-sizing: border-box; }
  .cl.fresh .num { box-shadow: 0 0 0 3px #57bbeb; }
  /* 말풍선: 흰 둥근 상자, 남색 제목, 라벨(회색 작은 글자) 위·값(남색) 아래 칸. 네이버 InfoWindow 의 테두리·바탕은 끈다.
     좁은 화면에서는 지도 폭에 맞춰 줄인다. 사진 칸 크기를 미리 정해 두어야 열 때 지도가 말풍선이 다 보이게 옮긴다 */
  .iw { box-sizing: border-box; width: min(270px, calc(100vw - 48px)); padding: 12px 14px 12px; background: #fff;
        border: 1px solid #e3e7ee; border-radius: 14px; box-shadow: 0 4px 16px rgba(5,23,102,.10);
        font-size: 12px; line-height: 1.45; }
  .iw img { width: 100%; aspect-ratio: 16 / 9; max-height: 30vh; object-fit: cover; display: block;
            background: #f6f7f9; border-radius: 10px; margin-bottom: 9px; }
  .iw .t { color: #051766; font-size: 15px; font-weight: 700; margin-bottom: 5px; }
  .iw .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 4px; }
  .iw .chip, .iw .badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; font-size: 11px; font-weight: 700;
                          line-height: 18px; white-space: nowrap; border-radius: 999px; }
  .iw .chip { background: #f6f7f9; color: #111; }
  .iw .chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .iw .new { background: #051766; color: #fff; }
  .iw .addr { color: #5e5e5e; margin-bottom: 6px; }
  .iw .f { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid #e3e7ee; }
  .iw .f > div { padding: 6px 0; border-bottom: 1px solid #e3e7ee; min-width: 0; }
  .iw .f > div:nth-child(even) { padding-left: 10px; border-left: 1px solid #e3e7ee; }
  .iw .f .wide { grid-column: 1 / -1; padding-left: 0 !important; border-left: 0 !important; }
  .iw .k { color: #5e5e5e; font-size: 11px; font-weight: 600; }
  .iw .v { color: #051766; font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
  .legend { position: absolute; left: 10px; bottom: 26px; z-index: 5; max-width: calc(100% - 20px); box-sizing: border-box;
            background: #fff; padding: 7px 14px; border-radius: 12px; font-size: 12px; line-height: 1.75;
            border: 1px solid #e3e7ee; box-shadow: 0 2px 10px rgba(5,23,102,.06); color: #111; }
  .legend .row { white-space: normal; }
  .legend .it { display: inline-block; white-space: nowrap; margin-right: 10px; }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  @media (max-width: 520px) { .legend { font-size: 11px; padding: 4px 8px; } .legend .hint { display: none; } }
</style></head>
<body>
<div id="err"></div>
<div id="map"></div>
<!-- 유형 색은 ui/naver_map.py TYPE_COLOR 와 같다 -->
<div class="legend">
  <div class="row"><span class="it"><span class="dot" style="background:#e62828"></span>포트홀</span><span class="it"><span class="dot" style="background:#ff9600"></span>균열</span><span class="it"><span class="dot" style="background:#ffdc00"></span>차선 마모</span><span class="it"><span class="dot" style="background:#28a0e6"></span>가드레일</span><span class="it"><span class="dot" style="background:#50c850"></span>표지판</span></div>
  <div class="row"><span class="it">● 미신고 ■ 신고됨 ▲ 보수 중</span><span class="it hint">숫자: 결함 묶음(누르면 확대)</span></div>
</div>
<script>
  var KOREA = { lat: 36.3, lon: 127.8, zoom: 7 };  // 처음 화면: 대한민국 전체
  var CLUSTER_UNTIL = 14;  // 이 확대보다 작을 때만 묶는다
  var GRID_PX = 56;        // 화면에서 이 거리 안의 점을 하나로 묶는다

  function fail(msg) {
    var e = document.getElementById('err');
    e.style.display = 'block';
    e.textContent = msg;
  }
  window.navermap_authFailure = function () {
    fail('네이버 지도 인증 실패: .env 의 NAVER_MAP_KEY_ID(Client ID)와 콘솔의 Web 서비스 URL(http://localhost:8501), Dynamic Map 선택을 확인하세요.');
  };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
    });
  }
  // 읽은 # 은 주소에서 지운다. 네이버 인증이 페이지 주소 전체를 보내는데, 결함이 많아 주소가 길면
  // (16건에 7KB) 인증이 실패한다(11/15 확인). 다음 목록은 Streamlit 이 iframe 주소를 바꿀 때 hashchange 로 온다
  var lastData = [], fitKey = '';
  function readData() {
    var h = location.hash.slice(1);
    if (!h) return lastData;
    var bin = atob(h.replace(/-/g, '+').replace(/_/g, '/'));
    var bytes = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); });
    var obj = JSON.parse(new TextDecoder().decode(bytes));
    lastData = obj.items || [];
    fitKey = obj.fit || '';
    history.replaceState(null, '', location.pathname + location.search);
    return lastData;
  }
  function coreHtml(d) {
    if (d.status === '보수 중') return '<div class="tri" style="border-bottom-color:' + esc(d.type_color) + '"></div>';
    return '<div class="pin' + (d.status === '미신고' ? ' c' : '') + '" style="background:' + esc(d.type_color) + '"></div>';
  }
  function sigHtml(d) {
    return '<div class="sig' + (d.fresh ? ' fresh' : '') + '">' + (d.fresh ? '<div class="new-tag">신규</div>' : '') +
      '<div class="core">' + coreHtml(d) + '</div></div>';
  }
  function clusterHtml(g) {
    // 묶음은 남색 원(유형 색은 작은 핀에만 쓴다). 새 결함이 들어 있으면 하늘색 테두리
    var fresh = g.some(function (d) { return d.fresh; });
    return '<div class="cl' + (fresh ? ' fresh' : '') + '"><div class="num">' + g.length + '</div></div>';
  }
  // 상태 배지 색: (글자, 바탕). ui/style.py STATUS_STYLE 과 같다
  var STATUS_STYLE = { '미신고': ['#c42b1c', '#fdeeec'], '신고됨': ['#051766', '#e6f3fb'], '보수 중': ['#8a5300', '#fff3dc'] };
  function infoHtml(d) {
    var st = STATUS_STYLE[d.status] || ['#5e5e5e', '#f6f7f9'];
    function cell(k, v, wide) {
      return '<div' + (wide ? ' class="wide"' : '') + '><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
    }
    return '<div class="iw">' + (d.photo ? '<img src="' + esc(d.photo) + '" alt="">' : '') +
      '<div class="t">' + esc(d.title) + '</div>' +
      '<div class="tags"><span class="chip"><i style="background:' + esc(d.type_color) + '"></i>' + esc(d.type) + '</span>' +
      '<span class="badge" style="color:' + st[0] + ';background:' + st[1] + '">' + esc(d.status) + '</span>' +
      (d.fresh ? '<span class="badge new">신규</span>' : '') + '</div>' +
      '<div class="addr">' + esc(d.address || '') + (d.region ? ' · ' + esc(d.region) : '') + '</div>' +
      '<div class="f">' + cell('확인 차량', d.vehicles + '대') + cell('관측 횟수', d.obs + '회') +
      cell('처음 확인', esc(d.first)) + cell('최근 확인', esc(d.last)) +
      (d.plates ? cell('차량 번호', esc(d.plates), true) : '') + '</div></div>';
  }



  var map = null, data = [], markers = [], openId = null, iw = null, fitted = '';
  var PIN_TOP = 9;  // 핀 가운데에서 위 끝(흰 테두리 바깥 그림자)까지(px). 말풍선 꼬리 끝을 여기에 붙인다

  // 말풍선은 마커가 아니라 '핀 위 끝' 좌표에 연다. 마커에 열면 네이버가 HTML 아이콘의 크기('새 결함' 표시 포함)로
  // 꼬리 위치를 잡아 핀에서 어긋나고, pixelOffset 은 몸통만 옮기고 꼬리는 그 자리에 두어 꼬리가 떨어진다(11/18 확인).
  // 화면 픽셀로 PIN_TOP 만큼 위라서 확대가 바뀌면 다시 계산한다(render)
  function tipAt(d) {
    var proj = map.getProjection(), p = proj.fromCoordToOffset(new naver.maps.LatLng(d.lat, d.lon));
    return proj.fromOffsetToCoord(new naver.maps.Point(p.x, p.y - PIN_TOP));
  }
  function openInfo(d) {
    iw.setContent(infoHtml(d));
    iw.open(map, tipAt(d));  // 열 때 지도가 말풍선이 다 보이게 옮긴다(네이버 기본 autoPan)
    openId = d.id;
  }
  function closeInfo() { if (iw.getMap()) iw.close(); openId = null; }

  // 화면 픽셀 격자로 가까운 점을 묶는다. 확대가 충분하면 하나씩
  function groups() {
    if (map.getZoom() >= CLUSTER_UNTIL) return data.map(function (d) { return [d]; });
    var proj = map.getProjection(), cells = {}, out = [];
    data.forEach(function (d) {
      var p = proj.fromCoordToOffset(new naver.maps.LatLng(d.lat, d.lon));
      var k = Math.floor(p.x / GRID_PX) + ':' + Math.floor(p.y / GRID_PX);
      if (!cells[k]) { cells[k] = []; out.push(cells[k]); }
      cells[k].push(d);
    });
    return out;
  }

  function render() {
    markers.forEach(function (m) { m.setMap(null); });
    markers = [];
    var reopen = null;
    groups().forEach(function (g) {
      if (g.length === 1) {
        var d = g[0];
        var marker = new naver.maps.Marker({
          position: new naver.maps.LatLng(d.lat, d.lon), map: map, title: d.title, zIndex: d.fresh ? 200 : 100,
          icon: { content: sigHtml(d), anchor: new naver.maps.Point(9, 9) }
        });
        naver.maps.Event.addListener(marker, 'click', function () {
          if (iw.getMap() && openId === d.id) { closeInfo(); return; }
          openInfo(d);
        });
        if (d.id === openId) reopen = d;
        markers.push(marker);
        return;
      }
      var lat = 0, lon = 0;
      g.forEach(function (d) { lat += d.lat; lon += d.lon; });
      var cm = new naver.maps.Marker({
        position: new naver.maps.LatLng(lat / g.length, lon / g.length), map: map, zIndex: 300,
        title: '결함 ' + g.length + '건 (누르면 확대)',
        icon: { content: clusterHtml(g), anchor: new naver.maps.Point(17, 17) }
      });
      naver.maps.Event.addListener(cm, 'click', function () {
        var b = new naver.maps.LatLngBounds(
          new naver.maps.LatLng(Math.min.apply(null, g.map(function (d) { return d.lat; })),
                                Math.min.apply(null, g.map(function (d) { return d.lon; }))),
          new naver.maps.LatLng(Math.max.apply(null, g.map(function (d) { return d.lat; })),
                                Math.max.apply(null, g.map(function (d) { return d.lon; }))));
        var z = map.getZoom();
        map.fitBounds(b, { top: 60, right: 60, bottom: 80, left: 60, maxZoom: 18 });
        // 점들이 거의 한 자리라 확대가 안 되면 묶음이 풀리는 확대까지 직접 올린다
        if (map.getZoom() <= z) map.morph(b.getCenter(), Math.max(z + 3, CLUSTER_UNTIL));
      });
      markers.push(cm);
    });
    // 열려 있던 말풍선은 새 내용(바뀐 상태 등)으로 다시 연다. 묶음 속으로 들어갔으면 닫는다
    // 이미 열려 있으면 다시 열지 않고 내용·자리만 바꾼다(5초마다 새로 그릴 때 지도가 움직이지 않게)
    if (reopen) {
      if (iw.getMap()) { iw.setContent(infoHtml(reopen)); iw.setPosition(tipAt(reopen)); } else openInfo(reopen);
    }
    else closeInfo();
  }

  // 필터가 바뀌면(fitKey) 걸러진 결함이 다 보이게 옮긴다. 필터가 없으면 전국. 결함이 없으면 그대로 둔다
  function fit() {
    if (fitKey === fitted) return;
    if (fitKey && !data.length) return;  // 걸러진 결함이 아직 없으면 생길 때 옮긴다
    fitted = fitKey;
    if (!fitKey) { map.morph(new naver.maps.LatLng(KOREA.lat, KOREA.lon), KOREA.zoom); return; }
    if (data.length === 1) { map.morph(new naver.maps.LatLng(data[0].lat, data[0].lon), 16); return; }
    var b = new naver.maps.LatLngBounds(
      new naver.maps.LatLng(Math.min.apply(null, data.map(function (d) { return d.lat; })),
                            Math.min.apply(null, data.map(function (d) { return d.lon; }))),
      new naver.maps.LatLng(Math.max.apply(null, data.map(function (d) { return d.lat; })),
                            Math.max.apply(null, data.map(function (d) { return d.lon; }))));
    map.fitBounds(b, { top: 60, right: 60, bottom: 90, left: 60, maxZoom: 17 });
  }

  function draw() {
    data = readData();
    if (!map) {
      map = new naver.maps.Map('map', {
        center: new naver.maps.LatLng(KOREA.lat, KOREA.lon), zoom: KOREA.zoom, scaleControl: true,
        zoomControl: true, zoomControlOptions: { position: naver.maps.Position.TOP_RIGHT }
      });
      iw = new naver.maps.InfoWindow({
        content: '', borderWidth: 0, backgroundColor: 'transparent', anchorSize: new naver.maps.Size(14, 10),
        anchorSkew: false, anchorColor: '#fff'
      });
      naver.maps.Event.addListener(map, 'click', closeInfo);  // 빈 곳을 누르면 닫는다
      // 창(iframe) 크기가 바뀌면 지도 크기도 맞춘다. 그대로 두면 처음 크기로 남아 옆이 비어 보인다
      var el = document.getElementById('map');
      new ResizeObserver(function () {
        if (el.clientWidth && el.clientHeight) map.setSize(new naver.maps.Size(el.clientWidth, el.clientHeight));
      }).observe(el);
      naver.maps.Event.addListener(map, 'zoom_changed', function () { if (data.length) render(); });
      naver.maps.Event.once(map, 'init', function () { fit(); render(); });
    }
    if (map.getProjection()) { fit(); render(); }
  }

  readData();  // 네이버 스크립트를 부르기 전에 # 을 지운다
  var key = new URLSearchParams(location.search).get('key');
  if (!key) {
    fail('NAVER_MAP_KEY_ID 가 없습니다.');
  } else {
    var s = document.createElement('script');
    s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(key);
    s.onload = function () { if (window.naver && naver.maps) { draw(); window.addEventListener('hashchange', draw); } };
    s.onerror = function () { fail('네이버 지도 스크립트를 불러오지 못했습니다(인터넷 연결 확인).'); };
    document.head.appendChild(s);
  }
</script>
</body></html>
