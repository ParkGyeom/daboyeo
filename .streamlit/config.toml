# 프로젝트 폴더에서 streamlit run ui/app.py 할 때 읽힌다.
[server]
# ui/static/ 을 /app/static/ 으로 내준다. 네이버 지도 페이지(ui/static/naver_map.html)를
# localhost:8501 주소로 띄워야 네이버가 등록한 Web 서비스 URL 로 인식한다.
enableStaticServing = true

[client]
# 오른쪽 위 Deploy·개발 메뉴를 숨긴다 (서비스 화면처럼)
toolbarMode = "minimal"

# 다보여 테마. 공공기관 업무 화면처럼: 흰 바탕, 얇은 회색 선, 작은 모서리. 화면별 모양은 ui/style.py
[theme]
base = "light"
primaryColor = "#0b50b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f7"
textColor = "#1e2124"
borderColor = "#d5d9de"
linkColor = "#0b50b4"
linkUnderline = false
font = "'Pretendard GOV Variable', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
headingFont = "'Pretendard GOV Variable', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
headingFontWeights = [800, 700, 700, 700, 600, 600]
baseRadius = "4px"
buttonRadius = "4px"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#f3f5f7"
dataframeBorderColor = "#d5d9de"
metricValueFontWeight = 800
