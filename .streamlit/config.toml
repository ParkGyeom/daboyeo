# 프로젝트 폴더에서 streamlit run ui/app.py 할 때 읽힌다.
[server]
# ui/static/ 을 /app/static/ 으로 내준다. 네이버 지도 페이지(ui/static/naver_map.html)를
# localhost:8501 주소로 띄워야 네이버가 등록한 Web 서비스 URL 로 인식한다.
enableStaticServing = true

[client]
# 오른쪽 위 Deploy·개발 메뉴를 숨긴다 (서비스 화면처럼)
toolbarMode = "minimal"

# 다보여 테마. 색은 발표 자료(플로우차트)와 같은 남색. 화면별 모양은 ui/style.py
[theme]
base = "light"
primaryColor = "#2f4fb5"
backgroundColor = "#f5f7fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2937"
borderColor = "#e3e8f2"
linkColor = "#2f4fb5"
linkUnderline = false
font = "'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
headingFont = "'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
headingFontWeights = [800, 700, 700, 600, 600, 600]
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#eef2fb"
dataframeBorderColor = "#e3e8f2"
metricValueFontWeight = 800
