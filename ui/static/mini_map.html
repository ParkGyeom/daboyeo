<!doctype html>
<!--
  결함 한 곳의 작은 네이버 지도(핀 하나). 시민 확인 화면·신고서에서 좌표 글자 대신 쓴다.
  ui/naver_map.py 의 mini() 가 /app/static/ 주소로 iframe 에 띄운다(srcdoc 은 네이버 인증 실패).
    ?key=<NAVER_MAP_KEY_ID>&lat=..&lon=..&color=%23ff9600&ring=%23d62728
    color = 핀 색(결함 유형, 관리자 지도와 같다), ring = 퍼지는 고리 색(위험도). ring 이 없으면 color
  인터넷이 없으면 좌표 글자로 대신 보인다.
-->
<html lang="ko"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
  #map { width: 100%; height: 100%; border-radius: 8px; overflow: hidden; }
  #err { display: none; position: absolute; inset: 0; z-index: 10; padding: 12px; background: #f4f5f7;
         color: #555; font-size: 13px; border-radius: 8px; }
  .pin { position: relative; width: 26px; height: 26px; }
  .pin .dot { position: absolute; left: 5px; top: 5px; width: 16px; height: 16px; border-radius: 50%;
              border: 3px solid #fff; box-sizing: border-box; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  .pin .ring { position: absolute; inset: 0; border-radius: 50%; opacity: 0; animation: pulse 2s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(.5); opacity: .7; } 100% { transform: scale(2.4); opacity: 0; } }
</style></head>
<body>
<div id="err"></div>
<div id="map"></div>
<script>
  var q = new URLSearchParams(location.search);
  var lat = parseFloat(q.get('lat')), lon = parseFloat(q.get('lon'));
  function hex(v, dflt) { return /^#[0-9a-fA-F]{3,6}$/.test(v || '') ? v : dflt; }
  var color = hex(q.get('color'), '#d62728'), ring = hex(q.get('ring'), color);
  function fail(msg) {
    var e = document.getElementById('err');
    e.style.display = 'block';
    e.textContent = msg + ' · 위치 ' + lat.toFixed(5) + ', ' + lon.toFixed(5);
  }
  window.navermap_authFailure = function () { fail('지도 인증 실패'); };
  function draw() {
    var p = new naver.maps.LatLng(lat, lon);
    var map = new naver.maps.Map('map', {
      center: p, zoom: 16, scaleControl: false, logoControl: true, mapDataControl: false,
      zoomControl: false, draggable: true, pinchZoom: true, scrollWheel: false
    });
    new naver.maps.Marker({
      position: p, map: map,
      icon: { content: '<div class="pin"><div class="ring" style="background:' + ring + '"></div>' +
                       '<div class="dot" style="background:' + color + '"></div></div>',
              anchor: new naver.maps.Point(13, 13) }
    });
  }
  var key = q.get('key');
  if (!key || isNaN(lat) || isNaN(lon)) {
    fail('지도 없음');
  } else {
    var s = document.createElement('script');
    s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(key);
    s.onload = function () { if (window.naver && naver.maps) draw(); };
    s.onerror = function () { fail('지도를 불러오지 못했습니다(인터넷 연결 확인)'); };
    document.head.appendChild(s);
  }
</script>
</body></html>
