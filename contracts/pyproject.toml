[project]
name = "daboyeo-contracts"
version = "0.1.0"
description = "박겸(AI)·정현우(백엔드)가 공유하는 인터페이스 계약: 클래스, 탐지 결과, 관측 전송, GPS CSV"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daboyeo_contracts"]
